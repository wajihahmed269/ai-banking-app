name: DevSecOps Pipeline

on:
  push:
    branches: [main, devsecops]
  pull_request:
    branches: [main]

permissions:
  issues: write
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: devsecops-bankapp
  IMAGE_TAG: ${{ github.sha }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ubuntu

jobs:
  # Gate 1: Secret Scan
  secret-scan:
    name: 🔐 Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate 2: Lint
  lint:
    name: 📏 Checkstyle Lint
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run Checkstyle
        run: |
          ./mvnw checkstyle:check -f pom.xml || true

  # Gate 3: SAST
  sast:
    name: 🛡️ Semgrep SAST
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config=p/java --sarif --output=semgrep.sarif . || true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # Gate 4: SCA
  sca:
    name: 📦 OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run OWASP Dependency Check
        run: |
          ./mvnw org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=9
        continue-on-error: true

  # Gate 5: Build
  build:
    name: 🔨 Maven Build
    runs-on: ubuntu-latest
    needs: sca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build JAR
        run: ./mvnw clean package -DskipTests -B

  # Gate 6: Container Scan
  container-scan:
    name: 🐳 Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t bankapp:${{ env.IMAGE_TAG }} .
      - uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: bankapp:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # Gate 7: Push to ECR
  push-ecr:
    name: 📤 Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, Tag, Push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }}
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${{ env.IMAGE_TAG }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # Gate 8: Deploy
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: push-ecr
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy via SSH
        env:
          PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          trap 'rm -f private_key.pem banking-app.rendered.yaml banking-secret.rendered.yaml' EXIT
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          : "${EC2_HOST:?EC2_HOST is required}"
          : "${EC2_USER:?EC2_USER is required}"
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          FRONTEND_URL="http://${EC2_HOST}:30081,http://${EC2_HOST},http://localhost:5173"

          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id bankapp/prod-secrets \
            --query SecretString \
            --output text)"
          MYSQL_URL="$(jq -r '.MYSQL_URL // .mysql_url // .["mysql-url"] // ""' <<< "$SECRET_JSON")"
          MYSQL_USER="$(jq -r '.MYSQL_USER // .mysql_user // .["mysql-user"] // ""' <<< "$SECRET_JSON")"
          MYSQL_PASSWORD="$(jq -r '.MYSQL_PASSWORD // .mysql_password // .["mysql-password"] // ""' <<< "$SECRET_JSON")"
          OLLAMA_URL="$(jq -r '.OLLAMA_URL // .ollama_url // .["ollama-url"] // ""' <<< "$SECRET_JSON")"
          JWT_SECRET="$(jq -r '.JWT_SECRET // .jwt_secret // .["jwt-secret"] // ""' <<< "$SECRET_JSON")"
          for required_secret in MYSQL_URL MYSQL_USER MYSQL_PASSWORD OLLAMA_URL JWT_SECRET; do
            test -n "${!required_secret}" || { echo "${required_secret} is missing from AWS Secrets Manager secret bankapp/prod-secrets" >&2; exit 1; }
          done
          echo "::add-mask::$MYSQL_URL"
          echo "::add-mask::$MYSQL_USER"
          echo "::add-mask::$MYSQL_PASSWORD"
          echo "::add-mask::$OLLAMA_URL"
          echo "::add-mask::$JWT_SECRET"
          MYSQL_URL_B64="$(printf '%s' "$MYSQL_URL" | base64 -w0)"
          MYSQL_USER_B64="$(printf '%s' "$MYSQL_USER" | base64 -w0)"
          MYSQL_PASSWORD_B64="$(printf '%s' "$MYSQL_PASSWORD" | base64 -w0)"
          OLLAMA_URL_B64="$(printf '%s' "$OLLAMA_URL" | base64 -w0)"
          JWT_SECRET_B64="$(printf '%s' "$JWT_SECRET" | base64 -w0)"

          sed -e "s|PLACEHOLDER_IMAGE|${IMAGE_URI}|g" \
              -e "s|PLACEHOLDER_FRONTEND_URL|${FRONTEND_URL}|g" \
              k8s/banking-app.yaml > banking-app.rendered.yaml
          cat > banking-secret.rendered.yaml << SECRET_EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: banking-secret
            namespace: default
          type: Opaque
          data:
            mysql-url: ${MYSQL_URL_B64}
            mysql-user: ${MYSQL_USER_B64}
            mysql-password: ${MYSQL_PASSWORD_B64}
            ollama-url: ${OLLAMA_URL_B64}
            jwt-secret: ${JWT_SECRET_B64}
          SECRET_EOF
          test -s banking-app.rendered.yaml
          test -s banking-secret.rendered.yaml
          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST "cat > /tmp/banking-app.yaml" < banking-app.rendered.yaml
          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST "cat > /tmp/banking-secret.yaml" < banking-secret.rendered.yaml
          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST "test -s /tmp/banking-app.yaml && test -s /tmp/banking-secret.yaml"
          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST << EOF
            set -euo pipefail
            kubectl create secret docker-registry ecr-secret \
              --docker-server=${ECR_REGISTRY} \
              --docker-username=AWS \
              --docker-password="\$(aws ecr get-login-password --region ${{ env.AWS_REGION }})" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f /tmp/banking-secret.yaml
            kubectl apply -f /tmp/banking-app.yaml
            kubectl rollout status deployment/banking-app --timeout=600s
          EOF

  # Gate 9: DAST
  dast:
    name: 🕷️ OWASP ZAP DAST Scan
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for app to be ready
        run: sleep 30
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://${{ secrets.EC2_HOST }}:30080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
