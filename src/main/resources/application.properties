spring.application.name=banking-app

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bankappdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}

server.port=8080

rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.capacity=${RATE_LIMIT_CAPACITY:60}
rate.limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
idempotency.retention-hours=${IDEMPOTENCY_RETENTION_HOURS:24}
money.max-transaction-amount=${MONEY_MAX_TRANSACTION_AMOUNT:10000.00}

sendgrid.enabled=${SENDGRID_ENABLED:false}
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:}
sendgrid.from-name=${SENDGRID_FROM_NAME:Zephyr Banking}
notifications.dev-recipient=${NOTIFICATION_DEV_RECIPIENT:}
cloudinary.enabled=${CLOUDINARY_ENABLED:false}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.max-file-size-bytes=${CLOUDINARY_MAX_FILE_SIZE_BYTES:5242880}
